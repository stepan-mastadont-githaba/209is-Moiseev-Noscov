<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/posts.css">
    <title>Document</title>
</head>
<body>
    <div>
        <div id="posts-container" class="posts-container"></div>
        <div id="photos-container" class="posts-container"></div>
    </div>

    <script>
        // URL API для получения постов
        const apiUrl = 'https://jsonplaceholder.typicode.com/posts';
        
        // Получаем данные
        fetch(apiUrl)
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                
                // Ограничим количество постов для примера
                const limitedPosts = posts.slice(0, 10);
                
                // Создаем HTML для каждого поста
                limitedPosts.forEach(post => {
                    const postElement = document.createElement('div');
                    postElement.innerHTML = `
                    <h1>Post ID: ${post.id}, User ID: ${post.userId}</h1>
                        <h1>${post.title}</h1>
                        <p>${post.body}</p>
                        <hr>
                    `;
                    container.appendChild(postElement);
                });
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('posts-container').innerHTML = 
                    '<p>Error loading posts. Please try again later.</p>';
            });
    </script>


    <script>
        // URL API для получения постов
        const photosUrl = 'https://jsonplaceholder.typicode.com/photos';
        
        // Получаем данные
        fetch(photosUrl)
            .then(response => response.json())
            .then(photos => {
                const container = document.getElementById('photos-container');
                
                // Ограничим количество постов для примера
                const limitedPhotos = photos.slice(0, 3);
                
                // Создаем HTML для каждого поста
                limitedPhotos.forEach(photo => {
                    const photoElement = document.createElement('div');
                    photoElement.innerHTML = `
                    <h1>Album ID: ${photo.id}</h1>
                        <h1>${photo.title}</h1>
                        <img>${photo.url}</img>
                        <img>${photo.thumbnailUrl}</img>
                        <hr>
                    `;
                    container.appendChild(photoElement);
                });
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('photo-container').innerHTML = 
                    '<p>Error loading posts. Please try again later.</p>';
            });
    </script>

</body>
</html>
